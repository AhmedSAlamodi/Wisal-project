services:
  - type: web
    name: wisal-university
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAFF_SESSION_SECRET
        generateValue: true
      - key: STAFF_PASSCODES_JSON
        sync: false
      - key: DATA_FILE_PATH
        sync: false
